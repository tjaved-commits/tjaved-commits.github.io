  <body class="login-page">
	<div class="container-fluid login-container">
		<div class="row">
			<div class="col-12 col-sm-6 col-md-6">
				<img src="images/left-img.png" alt="img" class="img-fluid" />
			</div>
			<div class="col-12 col-sm-6 col-md-6">
				<div>
				  <div class="login-logo">
					<a href="../index2.html"><img src="images/logo.png" alt="img" class="img-fluid" /></a>
				  </div>
				  <div class="login-content">
					  <h1>Hello there 👋</h1>
					  <p>Access your patient portal anywhere, and keep everything flowing in one place</p>
				  </div>
				  <!-- /.login-logo -->
				  <div class="card-login">
					<div class="card-login-content">

					  <form action="../index3.html" method="post">
						<div class="input-group mb-3">
							<div class="input-group-text">
								<span class="bi bi-envelope"></span>
							</div>
							<input type="email" class="form-control" placeholder="Email" />
						</div>
						<div class="input-group mb-3">
							<div class="input-group-text">
								<span class="bi bi-key"></span>
							</div>
							<input type="password" class="form-control" placeholder="Password" />
						</div>
						<!--begin::Row-->
						<p class="mb-3 text-right">
							Forgot your password? <a href="forgot-password.html">Contact Support</a>
						  </p>
						<div class="row">
						  <!-- /.col -->
						  <div class="col-12">
							<div class="d-grid gap-2">
							  <button type="submit" class="btn btn-primary">Get Started</button>
							</div>
						  </div>
						  <!-- /.col -->
						</div>
						<!--end::Row-->
					  </form>

					  <div class="social-auth-links text-center mb-3 d-grid gap-2">
						<p>OR</p>
						<a href="#" class="btn btn-primary">Create an Account</a>
					  </div>
					</div>
					<!-- /.login-card-body -->
				  </div>
				</div>
			</div>
		</div>
	</div>

    <!--end::Required Plugin(AdminLTE)--><!--begin::OverlayScrollbars Configure-->
    <script>
      const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
      const Default = {
        scrollbarTheme: 'os-theme-light',
        scrollbarAutoHide: 'leave',
        scrollbarClickScroll: true,
      };
      document.addEventListener('DOMContentLoaded', function () {
        const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);

        // Disable OverlayScrollbars on mobile devices to prevent touch interference
        const isMobile = window.innerWidth <= 992;

        if (
          sidebarWrapper &&
          OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
          !isMobile
        ) {
          OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
            scrollbars: {
              theme: Default.scrollbarTheme,
              autoHide: Default.scrollbarAutoHide,
              clickScroll: Default.scrollbarClickScroll,
            },
          });
        }
      });
    </script>
    <!--end::OverlayScrollbars Configure-->
    <!--end::Script-->
